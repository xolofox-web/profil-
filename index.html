<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>

        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&h=400&fit=crop" alt="Banner Profile" loading="eager" />

        </h1>
        <p class="bio">WhatsApp Multi-Device Bot &amp; Software Developer</p>
        
        <div class="stats">
          <span>45.8K+ Pengguna</span>
          <span class="divider">/</span>
          <span>1.4K+ Grup Aktif</span>
        </div>
